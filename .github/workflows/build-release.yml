name: Build and release exe

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name OBSAutoRecorder --distpath dist --workpath build --specpath build autostart_script.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBSAutoRecorder
          path: dist/OBSAutoRecorder.exe

      - name: Create versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/OBSAutoRecorder.exe config.example.json --title "${{ github.ref_name }}" --generate-notes

      - name: Publish rolling "latest" build (main branch)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git tag -f latest
          git push origin latest --force
          gh release delete latest --yes || true
          gh release create latest dist/OBSAutoRecorder.exe config.example.json \
            --title "Latest build (main)" \
            --notes "Automatically built from the latest commit on main (${{ github.sha }}). May be less stable than a tagged release." \
            --prerelease
